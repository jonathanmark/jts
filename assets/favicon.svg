<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Old School Industrialist monogram: forest green, double-ruled, serif J -->
  <rect width="64" height="64" rx="8" fill="#1F4E3D"/>
  <rect x="6" y="6" width="52" height="52" rx="5" fill="none" stroke="#E9E2D3" stroke-width="2"/>
  <rect x="11" y="11" width="42" height="42" rx="3" fill="none" stroke="#C46A4A" stroke-width="1.5"/>
  <text x="32" y="45" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="34" font-weight="600" fill="#F7F4EC">J</text>
</svg>
